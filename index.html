<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#05060a;color:#f3f5fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
body{min-height:100dvh;background:
radial-gradient(900px 600px at 15% -10%,rgba(94,140,255,.20),transparent 60%),
radial-gradient(800px 600px at 90% 0%,rgba(255,74,120,.16),transparent 60%),
radial-gradient(700px 700px at 50% 110%,rgba(60,255,200,.10),transparent 60%),
#05060a;
background-attachment:fixed}
a{color:inherit;text-decoration:none}
img{display:block}
.hidden{display:none!important}
.g{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 10px 30px rgba(0,0,0,.35)}

/* header */
#top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
background:linear-gradient(180deg,rgba(5,6,10,.92),rgba(5,6,10,.55) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#logo{font-weight:900;font-size:19px;letter-spacing:-.5px;white-space:nowrap}
#logo span{background:linear-gradient(90deg,#7fb0ff,#ff6a9c);-webkit-background-clip:text;background-clip:text;color:transparent}
#srch{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
#srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:14px}
#srch input::placeholder{color:rgba(255,255,255,.45)}
#av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;flex:0 0 auto;background:linear-gradient(135deg,#5e8cff,#ff4a78);border:0;color:#fff}

/* tabs */
#tabs{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:55;display:flex;gap:7px;padding:6px 12px 10px;overflow-x:auto;scrollbar-width:none;
background:linear-gradient(180deg,rgba(5,6,10,.85),transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:0 0 auto;padding:8px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);color:#cfd6e6;font-size:13px;font-weight:700;cursor:pointer;transition:.18s}
#tabs button.on{background:linear-gradient(135deg,#5e8cff,#ff4a78);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(94,140,255,.35)}

/* hero */
#hero{position:relative;margin:4px 12px 18px;border-radius:22px;overflow:hidden;min-height:290px;display:flex;align-items:flex-end;isolation:isolate}
#hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:saturate(115%)}
#hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.15),rgba(5,6,10,.75) 55%,#05060a)}
#hero .in{position:relative;z-index:2;padding:16px}
#hero h1{margin:0 0 8px;font-size:25px;line-height:1.15;letter-spacing:-.6px;text-shadow:0 4px 24px rgba(0,0,0,.7)}
#hero p{margin:0 0 12px;font-size:12.5px;color:#c2cadb;max-height:38px;overflow:hidden}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16)}
.acts{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:14px;border:0;font-size:13.5px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.16)}
.btn.p{background:#fff;color:#0a0c12;border-color:#fff}
.btn:active{transform:scale(.97)}

/* rows */
.row{margin:0 0 20px}
.row h2{margin:0 0 9px;padding:0 12px;font-size:15px;letter-spacing:-.2px}
.rail{display:flex;gap:10px;overflow-x:auto;padding:2px 12px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:114px;scroll-snap-align:start;cursor:pointer}
.card .ph{position:relative;width:100%;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#12151f,#1c2130);border:1px solid rgba(255,255,255,.08)}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .rt{position:absolute;bottom:6px;left:6px;font-size:10.5px;font-weight:800;padding:3px 6px;border-radius:7px;background:rgba(0,0,0,.72)}
.card .nm{margin-top:6px;font-size:11.5px;line-height:1.25;color:#d5dbe8;max-height:30px;overflow:hidden}

/* grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:11px;padding:0 12px 24px}
.grid .card{width:100%}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.grid.wide .ph{aspect-ratio:16/10}

/* live */
.lrow{display:flex;align-items:center;gap:10px;margin:0 12px 9px;padding:11px 12px;border-radius:16px;cursor:pointer}
.lrow .vs{flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.3}
.lrow .lg{width:30px;height:30px;object-fit:contain;flex:0 0 auto}
.pill{font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.1);flex:0 0 auto}
.pill.live{background:#e0203f;color:#fff}
.pill.up{background:rgba(94,140,255,.25);color:#a9c4ff}

/* empty / loader */
.empty{padding:26px 16px;text-align:center;color:#8f9ab0;font-size:13px}
.skel{height:150px;border-radius:16px;background:linear-gradient(100deg,rgba(255,255,255,.05),rgba(255,255,255,.11),rgba(255,255,255,.05));background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* PLAYER */
#big{position:fixed;inset:0;width:100vw;height:100dvh;z-index:900;background:#000;display:flex;flex-direction:column;overflow:hidden}
#big.hidden{display:none}
#bar{position:relative;z-index:6;display:flex;align-items:center;gap:7px;padding:7px 9px;padding-top:calc(7px + env(safe-area-inset-top));background:#080a10;border-bottom:1px solid rgba(255,255,255,.09);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar .ib{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:15px;cursor:pointer}
#bar .ttl{flex:1;min-width:60px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar select{flex:0 0 auto;max-width:104px;padding:7px 6px;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);color:#fff;font-size:11.5px;font-weight:700;outline:0}
#bar select option{background:#12151f;color:#fff}

#stage{position:relative;flex:1;min-height:0;background:#000}
#stage iframe,#stage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:block}
#load{position:absolute;inset:0;display:grid;place-items:center;gap:12px;z-index:3;background:#000;text-align:center;padding:20px}
#load .sp{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
#load .tx{font-size:12px;color:#9aa4ba;letter-spacing:1.6px;font-weight:700}
#load .sub{font-size:11.5px;color:#6f7a90;margin-top:7px}
#stuck{position:absolute;inset:0;z-index:4;display:none;place-items:center;background:rgba(5,6,10,.94);padding:20px;text-align:center}
#stuck.on{display:grid}
#stuck .in{max-width:330px}
#stuck h3{margin:0 0 6px;font-size:15px}
#stuck p{margin:0 0 14px;font-size:12px;color:#95a0b5;line-height:1.5}
#stuck .acts{justify-content:center}

/* fullscreen: bar overlay + hit strip */
body.fs #bar{position:absolute;top:0;left:0;right:0;background:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.35) 70%,transparent);border:0;transition:opacity .28s;padding-top:calc(7px + env(safe-area-inset-top))}
body.fs #bar.off{opacity:0;pointer-events:none}
body.fs #hit{display:block}
#hit{display:none;position:absolute;top:0;left:0;right:0;height:56px;z-index:5}
body.fs #stage{flex:1}
/* CSS rotate fallback (sirf jab device portrait ho aur orientation lock fail ho) */
body.rot #big{position:fixed;left:50%;top:50%;width:100dvh;height:100vw;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}
body.rot #bar{padding-top:7px}
body.rot #hit{display:none}

/* sheets */
#sheet{position:fixed;inset:0;z-index:950;background:rgba(3,4,8,.6);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
#sheet .pan{width:100%;max-width:520px;max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;background:#0b0d14;border-top:1px solid rgba(255,255,255,.12);padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 14px;font-size:16px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:#8e99af;margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
.fld input,.fld select{width:100%;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);color:#fff;font-size:14px;outline:0}
.fld input:focus{border-color:#5e8cff}
.fld small{display:block;margin-top:5px;font-size:11px;color:#7b869c;line-height:1.4}
.mi{display:flex;align-items:center;gap:11px;padding:13px 12px;border-radius:13px;background:rgba(255,255,255,.05);margin-bottom:8px;cursor:pointer;font-size:13.5px;font-weight:600}
.mi .ic{width:26px;text-align:center}
#banner{margin:0 12px 16px;padding:13px;border-radius:16px;display:flex;gap:11px;align-items:center;font-size:12.5px;line-height:1.4}
#banner b{display:block;font-size:13px;margin-bottom:2px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:999;padding:11px 16px;border-radius:12px;background:#eef2ff;color:#0a0c12;font-size:12.5px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pad{padding:0 12px}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="color-scheme" content="dark">
<title>TUNAmovies</title>
<link rel="preconnect" href="https://v3-cinemeta.strem.io">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://bingeapi.st">
<link rel="dns-prefetch" href="https://static-ca-cdn.eporner.com">
</head>
<body>

<header id="top">
  <div id="logo">TUNA<span>movies</span></div>
  <form id="srch" onsubmit="return false">
    <span>&#128269;</span>
    <input id="q" type="search" placeholder="Movie, series dhoondo..." autocomplete="off">
  </form>
  <button id="av">&#9786;</button>
</header>

<nav id="tabs"></nav>
<main id="view"></main>

<!-- player -->
<div id="big" class="hidden">
  <div id="bar">
    <button class="ib" id="pBack">&#8592;</button>
    <div class="ttl" id="pTitle"></div>
    <select id="pSrv" title="Server"></select>
    <select id="pAud" title="Audio"></select>
    <select id="pSub" title="Subtitle"></select>
    <button class="ib" id="pNext" title="Next server">&#8635;</button>
    <button class="ib" id="pTab" title="New tab">&#8599;</button>
    <button class="ib" id="pFs" title="Fullscreen">&#9974;</button>
  </div>
  <div id="stage">
    <div id="load"><div><div class="sp"></div><div class="tx">LOADING, ONE MOMENT</div><div class="sub" id="loadSub"></div></div></div>
    <div id="stuck"><div class="in">
      <h3>Ye server nahi chala</h3>
      <p id="stuckMsg">Agla server try karo, ya naye tab me kholo.</p>
      <div class="acts">
        <button class="btn p" id="sNext">Agla server</button>
        <button class="btn" id="sTab">Naye tab me</button>
        <button class="btn" id="sClose">Band</button>
      </div>
    </div></div>
  </div>
  <div id="hit"></div>
</div>

<div id="sheet" class="hidden"><div class="pan" id="sheetPan"></div></div>
<div id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const LS={get(k,d){try{const v=localStorage.getItem("nfx_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("nfx_"+k,JSON.stringify(v))}catch(e){}}};
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2400)}

const CM="https://v3-cinemeta.strem.io";
const CACHE=new Map();
async function fetchT(url,ms=10000){
  if(CACHE.has(url))return CACHE.get(url);
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(url,{signal:c.signal,referrerPolicy:"no-referrer"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();CACHE.set(url,j);return j;
  }finally{clearTimeout(t)}
}
const PX=[
  u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
  u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),
  u=>"https://corsproxy.io/?"+encodeURIComponent(u)
];
async function fetchPx(url,ms=9000){
  for(const p of PX){
    const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
    try{
      const r=await fetch(p(url),{signal:c.signal,referrerPolicy:"no-referrer"});
      if(!r.ok)continue;
      const txt=await r.text();
      return JSON.parse(txt);
    }catch(e){}finally{clearTimeout(t)}
  }
  return null;
}

const state={
  tab:"home", set:{qual:"1080",aud:"auto",sub:"off"},
  cur:null, srvs:[], si:0, tmr:null, healthy:false, mounted:0
};
try{Object.assign(state.set,LS.get("nfx_set",{})||{})}catch(e){}

/* ---------- catalog ---------- */
function poster(p){return p?p.replace(/^http:/,"https:"):""}
async function catalog(type,id,extra){
  const u=CM+"/catalog/"+type+"/"+id+(extra?"/"+extra:"")+".json";
  try{const j=await fetchT(u);return (j.metas||[]).filter(m=>m.poster&&m.id&&m.type)}catch(e){return[]}
}
async function meta(type,id){
  try{const j=await fetchT(CM+"/meta/"+type+"/"+id+".json",9000);return j.meta||null}catch(e){return null}
}

/* ---------- cards ---------- */
function card(m,wide){
  const c=el("div","card");
  c.innerHTML='<div class="ph"><img loading="lazy" referrerpolicy="no-referrer" src="'+esc(poster(m.poster))+'" alt="">'+
    (m.imdbRating?'<div class="rt">&#9733; '+esc(m.imdbRating)+'</div>':'')+'</div><div class="nm">'+esc(m.name)+'</div>';
  c.onclick=()=>openTitle({id:m.id,type:m.type,name:m.name,poster:m.poster,rating:m.imdbRating,desc:m.description});
  return c;
}
function rail(title,items){
  if(!items.length)return null;
  const r=el("section","row");
  r.appendChild(el("h2",null,esc(title)));
  const t=el("div","rail");
  items.forEach(m=>t.appendChild(card(m)));
  r.appendChild(t);
  return r;
}

/* ---------- tabs ---------- */
const TABS=[["home","Home"],["series","Series"],["movies","Movies"],["live","Live"],["porn","Porn"],["list","My List"]];
function drawTabs(){
  const t=$("#tabs");t.innerHTML="";
  TABS.forEach(([k,l])=>{
    const b=el("button",state.tab===k?"on":null,l);
    b.onclick=()=>go(k);
    t.appendChild(b);
  });
}
function go(k){state.tab=k;drawTabs();render()}
function render(){
  const v=$("#view");v.innerHTML="";
  window.scrollTo(0,0);
  if(state.tab==="home")return viewHome();
  if(state.tab==="movies")return viewGrid("movie","top","Movies");
  if(state.tab==="series")return viewGrid("series","top","Series");
  if(state.tab==="live")return viewLive();
  if(state.tab==="porn")return viewPorn();
  if(state.tab==="list")return viewList();
}

/* ---------- home ---------- */
async function viewHome(){
  const v=$("#view");
  if(!LS.get("nfx_tkey",""))setupBanner(v);
  const sk=el("div","pad");sk.innerHTML='<div class="skel" style="height:280px;border-radius:22px"></div>';v.appendChild(sk);

  const [movies,series]=await Promise.all([catalog("movie","top"),catalog("series","top")]);
  v.innerHTML="";
  if(!LS.get("nfx_tkey",""))setupBanner(v);
  const pool=movies.concat(series).filter(m=>m.poster);
  if(pool.length)hero(pool[Math.floor(Math.random()*Math.min(pool.length,12))],v);

  const rows=[
    ["Trending Movies",movies.slice(0,20)],
    ["Trending Series",series.slice(0,20)],
    ["Action",await catalog("movie","top","genre=Action")],
    ["Comedy",await catalog("movie","top","genre=Comedy")],
    ["Sci-Fi",await catalog("movie","top","genre=Sci-Fi")],
    ["Horror",await catalog("movie","top","genre=Horror")],
    ["Animation",await catalog("movie","top","genre=Animation")],
    ["Drama",await catalog("movie","top","genre=Drama")]
  ];
  rows.forEach(([t,i])=>{const r=rail(t,i.slice(0,20));if(r)v.appendChild(r)});
  if(!v.querySelector(".row"))v.appendChild(el("div","empty","Catalog load nahi hua. Net check karke dobara try karo."));
}
function hero(m,v){
  const h=el("section","g");h.id="hero";
  h.innerHTML='<div class="bg" style="background-image:url('+"'"+esc(poster(m.poster))+"'"+')"></div><div class="in">'+
    '<div class="chips">'+(m.imdbRating?'<span class="chip">&#9733; '+esc(m.imdbRating)+'</span>':'')+'<span class="chip">'+esc((m.type||"").toUpperCase())+'</span>'+(m.releaseInfo?'<span class="chip">'+esc(m.releaseInfo)+'</span>':'')+'</div>'+
    '<h1>'+esc(m.name)+'</h1><p>'+esc(m.description||"")+'</p><div class="acts">'+
    '<button class="btn p" id="hPlay">&#9654; Play</button><button class="btn" id="hInfo">Details</button></div></div>';
  v.appendChild(h);
  $("#hPlay").onclick=()=>openTitle({id:m.id,type:m.type,name:m.name,poster:m.poster,desc:m.description});
  $("#hInfo").onclick=()=>openTitle({id:m.id,type:m.type,name:m.name,poster:m.poster,desc:m.description});
}
function setupBanner(host){
  if(LS.get("nfx_setup_off",false))return;
  const b=el("div","g");b.id="banner";
  b.innerHTML='<div style="font-size:20px">&#127760;</div><div style="flex:1"><b>Dubbing list chahiye?</b>Settings me TMDB ki free key daalo, phir har title ki asli audio languages dikhengi.</div>';
  const go2=el("button","btn p","Key daalo");go2.style.padding="8px 12px";go2.style.fontSize="12px";
  go2.onclick=e=>{e.stopPropagation();sheetSettings()};
  b.appendChild(go2);
  b.onclick=()=>sheetSettings();
  host.appendChild(b);
}

/* ---------- grids ---------- */
async function viewGrid(type,id,title){
  const v=$("#view");
  v.appendChild(el("h2","pad",esc(title))).style.margin="4px 0 12px";
  const g=el("div","grid");
  for(let i=0;i<8;i++)g.appendChild(el("div","skel"));
  v.appendChild(g);
  const items=await catalog(type,id);
  g.innerHTML="";
  if(!items.length){g.appendChild(el("div","empty","Kuchh nahi mila."));return}
  items.forEach(m=>g.appendChild(card(m)));
}

/* ---------- search ---------- */
let sT;
$("#q").addEventListener("input",e=>{
  const q=e.target.value.trim();
  clearTimeout(sT);
  if(!q){render();return}
  sT=setTimeout(async()=>{
    const v=$("#view");v.innerHTML="";
    state.tab="search";drawTabs();
    const g=el("div","grid");
    for(let i=0;i<6;i++)g.appendChild(el("div","skel"));
    v.appendChild(el("h2","pad","Search: "+q)).style.margin="4px 0 12px";
    v.appendChild(g);
    const [a,b]=await Promise.all([
      fetchT(CM+"/catalog/movie/top/search="+encodeURIComponent(q)+".json").catch(()=>({})),
      fetchT(CM+"/catalog/series/top/search="+encodeURIComponent(q)+".json").catch(()=>({}))
    ]);
    const items=[...(a.metas||[]),...(b.metas||[])].filter(m=>m.poster);
    g.innerHTML="";
    if(!items.length){g.appendChild(el("div","empty","Kuchh nahi mila."));return}
    items.forEach(m=>g.appendChild(card(m)));
  },380);
});

/* ---------- detail ---------- */
async function openTitle(t){
  state.cur={...t};
  const v=$("#view");
  v.innerHTML='<div class="pad" style="padding-top:10px"><div class="skel" style="height:300px;border-radius:20px"></div></div>';

function srvList(c){
  const out=[];
  if(c.id&&c.id.startsWith("tt"))out.push({id:"binge",n:"Server 1",need:"imdb"});
  if(c.tmdb)out.push({id:"vidsrc",n:"Server 2",need:"tmdb"},{id:"vidfast",n:"Server 3",need:"tmdb"},{id:"vix",n:"Server 4",need:"tmdb"});
  return out.filter(s=>!state.blk||!state.blk[s.id+"_"+c.id]);
}
function srvUrl(s,c){
  const t=c.type==="series"?"tv":"movie";
  const aud=state.set.aud&&state.set.aud!=="auto"?state.set.aud:"";
  const sub=state.set.sub&&state.set.sub!=="off"?state.set.sub:"";
  if(s.id==="binge"){
    let u="https://bingeapi.st/embed/"+t+"/"+c.id+"?theme=dark&title=0&episodes=0";
    if(aud)u+="&lang="+aud; if(sub)u+="&sub_lang="+sub;
    return u;
  }
  if(s.id==="vidsrc"){
    let u="https://vidsrc.sh/embed/"+t+"/"+c.tmdb;
    if(c.type==="series")u+="/"+c.season+"/"+c.episode;
    if(aud)u+="?ds_lang="+aud; if(sub)u+="&ds_sub="+sub;
    return u;
  }
  if(s.id==="vidfast"){
    let u="https://vidfast.vc/"+t+"/"+c.tmdb;
    if(c.type==="series")u+="/"+c.season+"/"+c.episode;
    const q=[];if(aud)q.push("lang="+aud);if(sub)q.push("sub="+sub);q.push("autoPlay=true");
    return u+"?"+q.join("&");
  }
  if(s.id==="vix"){
    let u="https://vixsrc.to/"+t+"/"+c.tmdb;
    if(c.type==="series")u+="/"+c.season+"/"+c.episode;
    if(aud)u+="?lang="+aud;
    return u;
  }
  return "";
}

const LANGS=[["auto","Auto"],["hi","Hindi"],["en","English"],["ta","Tamil"],["te","Telugu"],["ml","Malayalam"],["kn","Kannada"],["bn","Bengali"],["mr","Marathi"],["pa","Punjabi"],["gu","Gujarati"],["ur","Urdu"]];
const SUBS=[["off","Off"],["hi","Hindi"],["en","English"],["ta","Tamil"],["te","Telugu"],["ml","Malayalam"]];
async function dubs(c){
  const key=LS.get("nfx_tkey","");if(!key||!c.tmdb)return LANGS;
  try{
    const t=c.type==="series"?"tv":"movie";
    const j=await fetchT("https://api.themoviedb.org/3/"+t+"/"+c.tmdb+"/translations?api_key="+encodeURIComponent(key),9000);
    const out=[["auto","Auto"]];
    (j.translations||[]).forEach(x=>{
      const k=x.iso_639_1;if(!k||k==="xx")return;

    });
    return out;
  }catch(e){return LANGS}
}

function armT(){

function playSource(o){
  state.cur={name:o.name,type:"x"};
  $("#pTitle").textContent=o.name||"";
  $("#pSrv").innerHTML="";$("#pAud").innerHTML="";$("#pSub").innerHTML="";

function onMsg(e){
  let d=e.data;
  if(typeof d==="string"){try{d=JSON.parse(d)}catch(x){return}}
  if(!d||typeof d!=="object")return;
  const ev=(d.event||d.type||d.name||"")+"";
  if(/play|playing|timeupdate|loadedmetadata|ready/i.test(ev))markOk();
  if(/error|fail/i.test(ev)){/* keep waiting */}
}
function markOk(){
  if(state.healthy)return;
  state.healthy=true;clearTimeout(state.tmr);
  $("#load").classList.add("hidden");
  $("#stuck").classList.remove("on");
}

async function startPlayer(){
  const c=state.cur;
  if(c.type==="series"&&c.season==null){const eps=(c.videos||[]).filter(v=>v.season!=null);if(eps.length){c.season=eps[0].season;c.episode=eps[0].episode}}
  $("#big").classList.remove("hidden");
  $("#pTitle").textContent=c.name||"";
  $("#stage").innerHTML='<div id="load"><div><div class="sp"></div><div class="tx">LOADING, ONE MOMENT</div><div class="sub" id="loadSub">Server dhoond rahe hain...</div></div></div><div id="stuck"><div class="in"><h3>Ye server nahi chala</h3><p>Agla server try karo.</p><div class="acts"><button class="btn p" id="sNext">Agla server</button><button class="btn" id="sTab">Naye tab me</button><button class="btn" id="sClose">Band</button></div></div></div>';
  bindStuck();

  if(!c.tmdb)await tmdbId(c);
  const list=srvList(c);
  if(!list.length){$("#load").classList.add("hidden");$("#stuck").classList.add("on");$("#stuckMsg").textContent="Koi server available nahi.";return}
  state.srvs=list;state.si=0;

  const d=await dubs(c);
  fillSel($("#pAud"),d,state.set.aud||"auto");
  fillSel($("#pSub"),SUBS,state.set.sub||"off");
  $("#pAud").onchange=e=>{state.set.aud=e.target.value;LS.set("nfx_set",state.set);reload(false)};
  $("#pSub").onchange=e=>{state.set.sub=e.target.value;LS.set("nfx_set",state.set);reload(false)};

  mount();
}
function fillSel(s,arr,val){
  s.innerHTML="";
  arr.forEach(([k,l])=>s.add(new Option(l,k)));
  s.value=val;
  if(s.value!==val)s.value=arr[0][0];
}
function mount(){
  const c=state.cur,s=state.srvs[state.si];
  $("#pSrv").innerHTML="";state.srvs.forEach((x,i)=>$("#pSrv").add(new Option(x.n,i)));$("#pSrv").value=state.si;
  $("#pSrv").onchange=e=>{state.si=+e.target.value;mount()};
  $("#pNext").onclick=next;
  const u=srvUrl(s,c);
  if(!u){next();return}
  $("#stuck").classList.remove("on");
  $("#load").classList.remove("hidden");
  clearStage();
  const f=document.createElement("iframe");
  f.setAttribute("allow","autoplay; fullscreen; encrypted-media; picture-in-picture");
  f.setAttribute("allowfullscreen","");
  f.setAttribute("referrerpolicy","no-referrer");
  f.src=u;
  $("#stage").appendChild(f);
  $("#pTab").onclick=()=>window.open(u,"_blank","noopener");
  state.healthy=false;armT();
  window.addEventListener("message",onMsg);

function reload(){mount()}

  state.si++;

let barT;
function hideBarSoon(){
  const b=$("#bar");if(!b)return;
  b.classList.remove("off");
  clearTimeout(barT);

async function setFS(on){
  const big=$("#big");
  if(!big)return;
  if(on){
    document.body.classList.add("fs");
    try{ if(big.requestFullscreen) await big.requestFullscreen({navigationUI:"hide"}) }catch(e){}
    if(innerHeight>innerWidth){
      let locked=false;
      try{ if(screen.orientation&&screen.orientation.lock){await screen.orientation.lock("landscape");locked=true} }catch(e){locked=false}
      if(!locked)document.body.classList.add("rot");
    }
    hideBarSoon();
  }else{
    document.body.classList.remove("fs","rot");
    try{ if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock() }catch(e){}
    try{ if(document.fullscreenElement)await document.exitFullscreen() }catch(e){}
  }
}

document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)document.body.classList.remove("fs","rot")});
addEventListener("resize",()=>{
  if(document.body.classList.contains("rot")&&innerWidth>innerHeight)document.body.classList.remove("rot");
  if(document.body.classList.contains("fs"))hideBarSoon();
});

/* ---------- SETTINGS ---------- */
function sheetSettings(){
  const p=$("#sheetPan");
  p.innerHTML='<h3>Settings</h3>'+
    '<div class="fld"><label>TMDB API key (v3 auth)</label><input id="setKey" placeholder="32 characters ka key" value="'+esc(LS.get("nfx_tkey",""))+'"><small>Dubbing + subtitle list ke liye. Read Access Token nahi — sirf API Key. Bina key bhi site chalti hai.</small></div>'+
    '<div class="fld"><label>Default quality</label><select id="setQual">'+["480","720","1080","2160"].map(q=>'<option value="'+q+'">'+q+'p'+(q==="2160"?" (4K)":"")+'</option>').join("")+'</select></div>'+
    '<div class="fld"><label>Default audio</label><select id="setAud">'+LANGS.map(([k,l])=>'<option value="'+k+'">'+l+'</option>').join("")+'</select></div>'+
    '<div class="fld"><label>Default subtitle</label><select id="setSub">'+SUBS.map(([k,l])=>'<option value="'+k+'">'+l+'</option>').join("")+'</select></div>'+
    '<button class="btn p" id="setSave" style="width:100%;justify-content:center">Save</button>';
  $("#setQual").value=state.set.qual;$("#setAud").value=state.set.aud;$("#setSub").value=state.set.sub||"off";
  $("#sheet").classList.remove("hidden");
  $("#setSave").onclick=()=>{
    state.set={qual:$("#setQual").value,aud:$("#setAud").value,sub:$("#setSub").value};
    LS.set("nfx_set",state.set);
    const k=$("#setKey").value.trim();
    if(k)LS.set("nfx_tkey",k);
    LS.set("nfx_setup_off",true);
    $("#sheet").classList.add("hidden");
    toast("Save ho gaya");
    render();
  };
}
$("#av").onclick=()=>{
  const p=$("#sheetPan");
  p.innerHTML='<h3>Profile</h3>'+
    '<div class="mi" id="mSet"><span class="ic">&#9881;</span> Settings</div>'+
    '<div class="mi" id="mList"><span class="ic">&#128278;</span> My List</div>'+
    '<div class="mi" id="mUp"><span class="ic">&#11014;</span> Video / photo upload</div>'+
    '<div class="mi" id="mClr"><span class="ic">&#128465;</span> Cache clear</div>';
  $("#sheet").classList.remove("hidden");
  $("#mSet").onclick=()=>{sheetSettings()};
  $("#mList").onclick=()=>{$("#sheet").classList.add("hidden");go("list")};
  $("#mUp").onclick=()=>{$("#sheet").classList.add("hidden");upload()};
  $("#mClr").onclick=()=>{CACHE.clear();toast("Cache clear")};
};
$("#sheet").onclick=e=>{if(e.target.id==="sheet")$("#sheet").classList.add("hidden")};

/* ---------- UPLOAD ---------- */
function upload(){
  const i=document.createElement("input");
  i.type="file";i.accept="video/*,image/*";
  i.onchange=()=>{
    const f=i.files[0];if(!f)return;
    const u=URL.createObjectURL(f);
    if(f.type.startsWith("video")){
      $("#big").classList.remove("hidden");
      $("#pTitle").textContent=f.name;
      $("#stage").innerHTML="";
      const v=document.createElement("video");
      v.src=u;v.controls=true;v.autoplay=true;v.playsInline=true;
      $("#stage").appendChild(v);
      $("#load").classList.add("hidden");
      $("#pSrv").innerHTML="";$("#pAud").innerHTML="";$("#pSub").innerHTML="";
    }else{
      window.open(u,"_blank");
    }
  };
  i.click();
}

/* ---------- BOOT ---------- */
drawTabs();
render();
</script>
</body>
</html>
