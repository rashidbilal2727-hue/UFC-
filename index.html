const SPORTS=["football","basketball","american-football","hockey","baseball","boxing","mma","racing","cricket","tennis"];
let liveCache=null,liveSport="all";
async function liveData(){
  if(liveCache)return liveCache;
  const j=await fetchPx("https://api.embedse.com/v1/matches",11000);
  liveCache=Array.isArray(j)?j:(j&&(j.matches||j.data))||[];

}
async function liveView(){
  const m=$("#main");
  m.appendChild(el("h3","sec","Live Sports"));
  const t=el("div","tabs");t.style.padding="10px 14px 12px";
  ["all",...SPORTS].forEach(s=>{
    const b=el("button","tab"+(liveSport===s?" on":""),s==="all"?"All":s.replace(/-/g," "));
    b.onclick=()=>{liveSport=s;render()};
    t.appendChild(b);
  });
  m.appendChild(t);
  const box=el("div");m.appendChild(box);
  for(let i=0;i<4;i++){const s=el("div","lrow");s.innerHTML='<div style="flex:1;height:16px"></div>';box.appendChild(s)}
  const list=await liveData();
  box.innerHTML="";
  let rows=list.filter(x=>x&&(x.teams||x.title));
  if(liveSport!=="all")rows=rows.filter(x=>((x.sport||x.category||"")+"").toLowerCase().includes(liveSport));
  if(!rows.length){box.appendChild(el("div","empty","Is sport ke matches abhi nahi hain."));return}
  rows.slice(0,60).forEach(x=>{
    const h=(x.teams&&x.teams.home&&(x.teams.home.name||x.teams.home))||x.home||"";
    const a=(x.teams&&x.teams.away&&(x.teams.away.name||x.teams.away))||x.away||"";
    const nm=x.title||[h,a].filter(Boolean).join(" vs ")||"Match";
    const st=(x.status||"").toLowerCase();
    const r=el("div","lrow");
    r.innerHTML='<div style="font-size:16px">&#9917;</div><div class="vs">'+esc(nm)+'<div style="font-size:11px;color:#8b96ab;font-weight:600;margin-top:2px">'+esc(x.league||x.competition||x.sport||"")+'</div></div>'+(st.includes("live")||st==="inprogress"?'<span class="pill live">LIVE</span>':'<span class="pill up">SOON</span>');
    r.onclick=()=>openLive(x,nm);
    box.appendChild(r);
  });
}
async function openLive(x,nm){
  const id=x.id||x._id;
  let src=x.embed_url||"";
  if(!src&&x.sources&&x.sources.length)src=x.sources[0].embed||x.sources[0].url||"";
  if(!src&&id){
    const d=await fetchPx("https://api.embedse.com/v1/matches/"+encodeURIComponent(id),9000);
    const o=Array.isArray(d)?d[0]:d;
    src=(o&&(o.embed_url||(o.sources&&o.sources[0]&&(o.sources[0].embed||o.sources[0].url))))||"";
  }
  if(!src){toast("Stream link nahi mila");return}
  openPlayer({name:nm,sub:"Live",src,kind:"live",ref:"origin"});
}

function uploadSheet(){
  sheet('<h3>Upload</h3><div class="fld"><label>Title</label><input id="upTitle" placeholder="Naam"></div><div class="fld"><label>File</label><input id="upFile" type="file" accept="video/*,image/*"></div><button class="wide red" id="upGo">Save</button>');
  $("#upGo").onclick=()=>{
    const f=$("#upFile").files[0];if(!f){toast("File chuno");return}
    const r=new FileReader();
    r.onload=()=>{
      const up=LS.get("nfx_uploads",[])||[];
      up.unshift({name:$("#upTitle").value.trim()||f.name,type:f.type,data:r.result,ts:Date.now()});
      try{LS.set("nfx_uploads",up.slice(0,6))}catch(e){toast("Bada file — sirf list me")}
      $("#sheet").classList.add("hidden");toast("Add ho gaya");render();
    };
    r.readAsDataURL(f);
  };
}
function playUpload(u){
  $("#pl").classList.remove("hidden");
  $("#plTitle").textContent=u.name;$("#plSub").textContent="Upload";
  $("#plSrv").innerHTML="";$("#plAud").innerHTML="";$("#plSub").innerHTML="";$("#plHint").textContent="";
  $("#plStuck").classList.add("hidden");$("#plLoad").classList.add("off");
  $("#stage").innerHTML="";
  const v=document.createElement("video");
  v.src=u.data;v.controls=true;v.autoplay=true;v.playsInline=true;
  $("#stage").appendChild(v);
}

/* ---------- PLAYER ---------- */
function armW(ms){clearTimeout(state.tmr);state.tmr=setTimeout(()=>{if(!state.ok)stuckOn()},ms||12000)}
function stuckOn(){$("#plLoad").classList.add("off");$("#plStuck").classList.remove("hidden")}
function healthy(){$("#plStuck").classList.add("hidden");$("#plLoad").classList.add("off");state.ok=true;clearTimeout(state.tmr)}
function onMsg(e){
  let d=e.data;if(typeof d==="string"){try{d=JSON.parse(d)}catch(x){return}}
  if(!d||typeof d!=="object")return;
  const ev=(d.event||d.type||d.name||"")+"";
  if(/play|playing|timeupdate|loadedmetadata|ready/i.test(ev))healthy();
}
addEventListener("message",onMsg);

function closePlayer(){
  clearTimeout(state.tmr);
  $("#pl").classList.add("hidden");
  $("#stage").innerHTML="";
  setFS(false);
  if(state.mode==="play"&&state.cur&&state.cur.tmdb)LS.set("nfx_resume",{id:state.cur.id,season:state.cur.season,episode:state.cur.episode});
}
$("#plBack").onclick=closePlayer;
$("#stkClose").onclick=closePlayer;
$("#stkNext").onclick=()=>nextSrv();
$("#stkTab").onclick=()=>{const u=$("#plTab").dataset.u;if(u)window.open(u,"_blank","noopener")};

function srvList(c){
  const out=[];
  if(c.id&&String(c.id).startsWith("tt"))out.push({id:"binge",n:"Server 1"});
  if(c.tmdb)out.push({id:"vidsrc",n:"Server 2"},{id:"vidfast",n:"Server 3"},{id:"vix",n:"Server 4"});
  return out.filter(s=>!state.blk[s.id+"_"+c.id]);
}
function srvUrl(s,c){
  const t=c.type==="series"?"tv":"movie";
  const aud=state.set.aud&&state.set.aud!=="auto"?state.set.aud:"";
  const sub=state.set.sub&&state.set.sub!=="off"?state.set.sub:"";
  if(s.id==="binge"){let u="https://bingeapi.st/embed/"+t+"/"+c.id+"?theme=dark&title=0&episodes=0";if(aud)u+="&lang="+aud;if(sub)u+="&sub_lang="+sub;return u}
  if(s.id==="vidsrc"){let u="https://vidsrc.sh/embed/"+t+"/"+c.tmdb+(c.type==="series"?"/"+c.season+"/"+c.episode:"");const q=[];if(aud)q.push("ds_lang="+aud);if(sub)q.push("ds_sub="+sub);return u+(q.length?"?"+q.join("&"):"")}
  if(s.id==="vidfast"){let u="https://vidfast.vc/"+t+"/"+c.tmdb+(c.type==="series"?"/"+c.season+"/"+c.episode:"");const q=["autoPlay=true"];if(aud)q.push("lang="+aud);if(sub)q.push("sub="+sub);return u+"?"+q.join("&")}
  if(s.id==="vix"){let u="https://vixsrc.to/"+t+"/"+c.tmdb+(c.type==="series"?"/"+c.season+"/"+c.episode:"");if(aud)u+="?lang="+aud;return u}
  return "";
}
async function tmdbOf(c){
  if(c.tmdb)return c.tmdb;
  const k=LS.get("nfx_tkey","");if(!k)return "";
  try{
    const t=c.type==="series"?"tv":"movie";
    const j=await fetchT("https://api.themoviedb.org/3/search/"+t+"?api_key="+encodeURIComponent(k)+"&query="+encodeURIComponent(c.name),9000);
    const r=(j.results||[])[0];if(r){c.tmdb=r.id;return r.id}
  }catch(e){}
  return "";
}
async function dubsOf(c){
  const k=LS.get("nfx_tkey","");if(!k||!c.tmdb)return LANGS;
  try{
    const t=c.type==="series"?"tv":"movie";
    const j=await fetchT("https://api.themoviedb.org/3/"+t+"/"+c.tmdb+"/translations?api_key="+encodeURIComponent(k),9000);
    const out=[["auto","Auto"]];
    (j.translations||[]).forEach(x=>{
      const i=x.iso_639_1;if(!i||i==="xx")return;
      if(!out.some(o=>o[0]===i)){const m=LANGS.find(l=>l[0]===i);out.push([i,m?m[1]:x.english_name||i.toUpperCase()])}
    });
    return out;
  }catch(e){return LANGS}
}
function fill(sel,arr,val){
  sel.innerHTML="";arr.forEach(([k,l])=>sel.add(new Option(l,k)));
  sel.value=val;if(sel.value!==val)sel.value=arr[0][0];
}

async function play(c){
  state.cur={...c};state.mode="play";
  $("#pl").classList.remove("hidden");
  $("#plTitle").textContent=c.name||"";$("#plSub").textContent=c.type==="series"?"S"+(c.season||1)+" E"+(c.episode||1):"Movie";
  $("#plStuck").classList.add("hidden");$("#plLoad").classList.remove("off");
  $("#plHint").textContent="";
  $("#plAud").style.display="";$("#plSub").style.display="";$("#plNext").style.display="";
  if(!c.tmdb)await tmdbOf(c);
  const list=srvList(c);
  if(!list.length){stuckOn();return}
  state.srvs=list;state.si=0;
  fill($("#plSrv"),list.map((s,i)=>[String(i),s.n]),"0");
  $("#plSrv").onchange=e=>{state.si=+e.target.value;mount()};
  const d=await dubsOf(c);
  fill($("#plAud"),d,state.set.aud||"auto");
  fill($("#plSub"),SUBS,state.set.sub||"off");
  $("#plAud").onchange=e=>{state.set.aud=e.target.value;LS.set("nfx_set",state.set);mount()};
  $("#plSub").onchange=e=>{state.set.sub=e.target.value;LS.set("nfx_set",state.set);mount()};
  mount();
}
function mount(){
  const c=state.cur,s=state.srvs[state.si];
  const u=srvUrl(s,c);
  if(!u){nextSrv();return}
  $("#plStuck").classList.add("hidden");$("#plLoad").classList.remove("off");
  $("#plSrv").value=String(state.si);
  $("#plTab").dataset.u=u;
  $("#stage").innerHTML="";
  const f=document.createElement("iframe");
  f.setAttribute("allow","autoplay; fullscreen; encrypted-media; picture-in-picture");
  f.setAttribute("allowfullscreen","");
  f.setAttribute("referrerpolicy","no-referrer");
  f.src=u;
  $("#stage").appendChild(f);
  state.ok=false;armW(12000);
}
function nextSrv(){
  if(!state.srvs.length)return;
  if(state.srvs[state.si])state.blk[state.srvs[state.si].id+"_"+(state.cur&&state.cur.id)]=1;
  state.si++;
  if(state.si>=state.srvs.length){state.si=0;toast("Sab server try ho gaye")}
  mount();
}
$("#plNext").onclick=nextSrv;
$("#plTab").onclick=()=>{const u=$("#plTab").dataset.u;if(u)window.open(u,"_blank","noopener")};

function openPlayer(o){
  state.mode=o.kind;state.cur={name:o.name};
  $("#pl").classList.remove("hidden");
  $("#plTitle").textContent=o.name||"";$("#plSub").textContent=o.sub||"";
  $("#plSrv").innerHTML="";$("#plAud").innerHTML="";$("#plSub").innerHTML="";$("#plHint").textContent="";
  $("#plStuck").classList.add("hidden");$("#plLoad").classList.remove("off");
  $("#plTab").dataset.u=o.src;
  $("#stage").innerHTML="";
  const f=document.createElement("iframe");
  f.setAttribute("allow","autoplay; fullscreen; encrypted-media; picture-in-picture");
  f.setAttribute("allowfullscreen","");
  f.setAttribute("referrerpolicy",o.ref||"no-referrer");
  f.src=o.src;
  $("#stage").appendChild(f);
  state.ok=false;armW(14000);
}

/* ---------- FULLSCREEN ---------- */
let barT;
function hideBars(show){
  const t=$("#plTop"),b=$("#plBot");
  clearTimeout(barT);
  t.classList.remove("off");b.classList.remove("off");
  if(show===false)return;
  barT=setTimeout(()=>{t.classList.add("off");b.classList.add("off")},3200);
}
async function setFS(on){
  const pl=$("#pl");
  if(on){
    document.body.classList.add("fs");
    try{ if(pl.requestFullscreen) await pl.requestFullscreen({navigationUI:"hide"}) }catch(e){}
    if(innerHeight>innerWidth){
      let locked=false;
      try{ if(screen.orientation&&screen.orientation.lock){await screen.orientation.lock("landscape");locked=true} }catch(e){}
      if(!locked)document.body.classList.add("rot");
    }
    hideBars(true);
  }else{
    document.body.classList.remove("fs","rot");
    try{ if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock() }catch(e){}
    try{ if(document.fullscreenElement)await document.exitFullscreen() }catch(e){}
    hideBars(false);
  }
}
$("#plFs").onclick=()=>setFS(!document.body.classList.contains("fs"));
$("#fsFloat").onclick=()=>setFS(true);
$("#hit").onclick=()=>{const t=$("#plTop");if(t.classList.contains("off"))hideBars(true);else{t.classList.add("off");$("#plBot").classList.add("off")}};
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)document.body.classList.remove("fs","rot")});
addEventListener("resize",()=>{
  if(document.body.classList.contains("rot")&&innerWidth>innerHeight)document.body.classList.remove("rot");
  if(document.body.classList.contains("fs"))hideBars(true);
});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#pl").classList.contains("hidden"))closePlayer()});

/* ---------- boot ---------- */
if(state.user&&state.user.id)$("#bAcc").textContent=state.user.id[0].toUpperCase();
go("home");
</script>
