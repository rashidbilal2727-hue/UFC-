
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORM-X2</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#08090d;color:#eee;
 font-family:Arial,sans-serif;overflow:hidden;
}
header{
 padding:19px;background:#101116;
 border-bottom:1px solid #29202a;
 display:flex;justify-content:space-between;
 align-items:center;
}
.logo{font-size:21px;font-weight:900;color:#ff345d}
.status{font-size:11px;color:#aaa}
main{padding:15px;max-width:600px;margin:auto}
.panel{
 background:#12141c;border:1px solid #292b35;
 border-radius:13px;padding:15px;margin-bottom:13px;
}
h3{font-size:13px;color:#ff4567;margin:0 0 13px}
button{
 background:#e92c50;color:white;border:0;
 border-radius:8px;padding:12px;font-weight:bold;
}
button.secondary{background:#252833}
button:active{opacity:.7}
.row{display:flex;gap:9px;align-items:center}
.row button{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#1b1d27;padding:13px 5px;text-align:center;border-radius:9px}
.stat strong{display:block;color:#ff496a;font-size:23px}
.stat small{color:#999}
canvas{
 display:block;width:100%;height:270px;
 background:#090b12;border:1px solid #343644;
 border-radius:10px;touch-action:manipulation;
}
label{font-size:12px;color:#aaa}
input[type=range]{width:100%;accent-color:#ff345d}
#message{font-size:12px;color:#aaa;margin-top:10px}
footer{text-align:center;color:#555;font-size:10px;padding:10px}
</style>
</head>
<body>
<header>
 <div class="logo">WORM-X2</div>
 <div class="status">OFFLINE TRAINING ENGINE</div>
</header>

<main>
 <section class="panel">
  <h3>TRAINING STATISTICS</h3>
  <div class="stats">
   <div class="stat"><strong id="hits">0</strong><small>HITS</small></div>
   <div class="stat"><strong id="misses">0</strong><small>MISSES</small></div>
   <div class="stat"><strong id="accuracy">0%</strong><small>ACCURACY</small></div>
  </div>
 </section>

 <section class="panel">
  <h3>AIM TRAINING ARENA</h3>
  <canvas id="arena" width="600" height="360"></canvas>
  <div class="row" style="margin-top:12px">
   <button id="start">START</button>
   <button id="stop" class="secondary">PAUSE</button>
   <button id="reset" class="secondary">RESET</button>
  </div>
  <p id="message">Press START and tap the targets.</p>
 </section>

 <section class="panel">
  <h3>TRAINING SETTINGS</h3>
  <label>Target size: <span id="sizeValue">30</span></label>
  <input id="targetSize" type="range" min="12" max="55" value="30">
  <label>Target speed: <span id="speedValue">3</span></label>
  <input id="targetSpeed" type="range" min="1" max="10" value="3">
 </section>

 <section class="panel">
  <h3>IMAGE ANALYSIS</h3>
  <label>Select a locally saved practice screenshot</label>
  <input id="imageInput" type="file" accept="image/*" style="margin:12px 0;width:100%">
  <canvas id="imageCanvas" width="600" height="360"></canvas>
  <p id="imageMessage">Tap the image to mark a practice aim point.</p>
  <button class="secondary" id="clearImage">CLEAR IMAGE</button>
 </section>
</main>
<footer>WORM-X2 • LOCAL TRAINING TOOL • NO GAME MODIFICATION</footer>

<script>
"use strict";

const arena=document.getElementById("arena");
const ctx=arena.getContext("2d");
const imageCanvas=document.getElementById("imageCanvas");
const ictx=imageCanvas.getContext("2d");

let targets=[],hits=0,misses=0,running=false;
let frame=null,last=0;

const size=document.getElementById("targetSize");
const speed=document.getElementById("targetSpeed");

function stats(){
 document.getElementById("hits").textContent=hits;
 document.getElementById("misses").textContent=misses;
 const total=hits+misses;
 document.getElementById("accuracy").textContent=
 total?Math.round(hits/total*100)+"%":"0%";
}

function spawn(){
 const r=Number(size.value);
 targets.push({
  x:r+Math.random()*(arena.width-2*r),
  y:r+Math.random()*(arena.height-2*r),
  r,dx:(Math.random()-.5)*2,
  dy:(Math.random()-.5)*2
 });
}

function draw(){
 ctx.clearRect(0,0,arena.width,arena.height);
 ctx.strokeStyle="#242936";
 ctx.lineWidth=1;
 for(let x=0;x<arena.width;x+=40){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,arena.height);ctx.stroke();
 }
 for(let y=0;y<arena.height;y+=40){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(arena.width,y);ctx.stroke();
 }
 targets.forEach(t=>{
  ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);
  ctx.fillStyle="#35121e";ctx.fill();
  ctx.strokeStyle="#ff4267";ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(t.x,t.y,t.r*.42,0,Math.PI*2);
  ctx.strokeStyle="#ff9aac";ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(t.x,t.y,3,0,Math.PI*2);
  ctx.fillStyle="#fff";ctx.fill();
 });
}

function loop(time){
 if(!running)return;
 const dt=Math.min((time-last)/16.67,2);
 last=time;
 const velocity=Number(speed.value)*.45;
 targets.forEach(t=>{
  t.x+=t.dx*velocity*dt;
  t.y+=t.dy*velocity*dt;
  if(t.x<t.r||t.x>arena.width-t.r)t.dx*=-1;
  if(t.y<t.r||t.y>arena.height-t.r)t.dy*=-1;
 });
 if(targets.length<3)spawn();
 draw();
 frame=requestAnimationFrame(loop);
}

document.getElementById("start").onclick=()=>{
 if(running)return;
 running=true;
 last=performance.now();
 document.getElementById("message").textContent="Training active";
 frame=requestAnimationFrame(loop);
};

document.getElementById("stop").onclick=()=>{
 running=false;
 cancelAnimationFrame(frame);
 document.getElementById("message").textContent="Training paused";
};

document.getElementById("reset").onclick=()=>{
 running=false;cancelAnimationFrame(frame);
 targets=[];hits=0;misses=0;stats();draw();
 document.getElementById("message").textContent="Training reset";
};

arena.addEventListener("pointerdown",e=>{
 if(!running)return;
 const rect=arena.getBoundingClientRect();
 const x=(e.clientX-rect.left)*arena.width/rect.width;
 const y=(e.clientY-rect.top)*arena.height/rect.height;
 const index=targets.findIndex(t=>Math.hypot(t.x-x,t.y-y)<=t.r);
 if(index>=0){
  targets.splice(index,1);hits++;
 }else misses++;
 stats();draw();
});

size.oninput=()=>{
 document.getElementById("sizeValue").textContent=size.value;
};
speed.oninput=()=>{
 document.getElementById("speedValue").textContent=speed.value;
};

let uploadedImage=null;

document.getElementById("imageInput").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){
  alert("Select an image file");return;
 }
 const url=URL.createObjectURL(file);
 const img=new Image();
 img.onload=()=>{
  uploadedImage=img;
  ictx.clearRect(0,0,600,360);
  const scale=Math.min(600/img.width,360/img.height);
  const w=img.width*scale,h=img.height*scale;
  ictx.drawImage(img,(600-w)/2,(360-h)/2,w,h);
  URL.revokeObjectURL(url);
 };
 img.onerror=()=>{URL.revokeObjectURL(url);alert("Image loading failed");};
 img.src=url;
};

imageCanvas.addEventListener("pointerdown",e=>{
 if(!uploadedImage)return;
 const r=imageCanvas.getBoundingClientRect();
 const x=(e.clientX-r.left)*600/r.width;
 const y=(e.clientY-r.top)*360/r.height;
 ictx.beginPath();ictx.arc(x,y,14,0,Math.PI*2);
 ictx.strokeStyle="#ff345d";ictx.lineWidth=3;ictx.stroke();
 ictx.beginPath();ictx.moveTo(x-22,y);ictx.lineTo(x+22,y);
 ictx.moveTo(x,y-22);ictx.lineTo(x,y+22);
 ictx.stroke();
 document.getElementById("imageMessage").textContent=
 "Practice marker: "+Math.round(x)+", "+Math.round(y);
});

document.getElementById("clearImage").onclick=()=>{
 uploadedImage=null;
 ictx.clearRect(0,0,600,360);
 document.getElementById("imageInput").value="";
 document.getElementById("imageMessage").textContent="Image cleared";
};

draw();
stats();
</script>
</body>
</html>
